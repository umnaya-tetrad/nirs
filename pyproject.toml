[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umnaya-tetrad-cas"
version = "0.1.0"
description = "LaTeX step verification and GT oracle evaluation with SymPy"
requires-python = ">=3.10"
dependencies = ["sympy==1.14.0", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx>=0.27,<1"]
vlm = ["httpx>=0.27,<1"]

[project.scripts]
nirs-cas = "nirs_cas.cli:main"

[tool.setuptools.packages.find]
include = ["nirs_cas*", "nirs_llm*", "evaluator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
