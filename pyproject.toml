[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umnaya-tetrad-cas"
version = "0.1.0"
description = "Strict school algebra LaTeX parser and preliminary CAS feasibility experiment"
requires-python = ">=3.10"
dependencies = ["sympy==1.14.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
nirs-cas = "nirs_cas.cli:main"

[tool.setuptools.packages.find]
include = ["nirs_cas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
